services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vitald}
      POSTGRES_USER: ${POSTGRES_USER:-vitald}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  vitald:
    build:
      context: .
      args:
        VERSION: ${VITALD_VERSION:-}
        COMMIT: ${VITALD_COMMIT:-}
        DATE: ${VITALD_BUILD_DATE:-}
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ${VITALD_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vitald}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vitald}?sslmode=disable
      VITALD_TOKEN_PATH: /config/token.json
      VITALD_RAW_DATA_PATH: /data/raw
      VITALD_TIMEZONE: ${VITALD_TIMEZONE:-Asia/Riyadh}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - vitald-config:/config
      - vitald-data:/data

  backup:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: Dockerfile.backup
    user: "0:0"
    security_opt:
      - label=disable
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ${VITALD_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vitald}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vitald}?sslmode=disable
      VITALD_VERSION: ${VITALD_VERSION:-dev}
      VITALD_COMMIT: ${VITALD_COMMIT:-unknown}
    volumes:
      - vitald-config:/source/config:ro
      - vitald-data:/source/data:ro

  restore:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: Dockerfile.backup
    user: "0:0"
    security_opt:
      - label=disable
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ${VITALD_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vitald}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vitald}?sslmode=disable
    volumes:
      - vitald-config:/source/config
      - vitald-data:/source/data

volumes:
  postgres-data:
  vitald-config:
  vitald-data:
