services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vitald}
      POSTGRES_USER: ${POSTGRES_USER:-vitald}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  vitald:
    build:
      context: .
      args:
        VERSION: ${VITALD_VERSION:-}
        COMMIT: ${VITALD_COMMIT:-}
        DATE: ${VITALD_BUILD_DATE:-}
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ${VITALD_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vitald}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vitald}?sslmode=disable
      VITALD_TOKEN_PATH: /config/token.json
      VITALD_RAW_DATA_PATH: /data/raw
      VITALD_TIMEZONE: ${VITALD_TIMEZONE:-Asia/Riyadh}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - vitald-config:/config
      - vitald-data:/data

  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VITALD_GRAFANA_DB_NAME: ${POSTGRES_DB:-vitald}
      VITALD_GRAFANA_DB_USER: ${VITALD_GRAFANA_DB_USER:-vitald_grafana}
      VITALD_GRAFANA_DB_PASSWORD: ${VITALD_GRAFANA_DB_PASSWORD:?set VITALD_GRAFANA_DB_PASSWORD in .env}
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?set GRAFANA_SECRET_KEY in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Riyadh
      GF_SERVER_ROOT_URL: http://127.0.0.1:3107
      GF_LOG_MODE: console
      GF_LOG_LEVEL: info
      TZ: Asia/Riyadh
    ports:
      - "127.0.0.1:3107:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro,Z
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro,Z
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro,Z

  backup:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: Dockerfile.backup
    user: "0:0"
    security_opt:
      - label=disable
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ${VITALD_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vitald}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vitald}?sslmode=disable
      VITALD_VERSION: ${VITALD_VERSION:-dev}
      VITALD_COMMIT: ${VITALD_COMMIT:-unknown}
    volumes:
      - vitald-config:/source/config:ro
      - vitald-data:/source/data:ro

  restore:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: Dockerfile.backup
    user: "0:0"
    security_opt:
      - label=disable
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ${VITALD_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vitald}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vitald}?sslmode=disable
    volumes:
      - vitald-config:/source/config
      - vitald-data:/source/data

volumes:
  postgres-data:
  vitald-config:
  vitald-data:
  grafana-data:
